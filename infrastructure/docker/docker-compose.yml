# ============================================================================
# DATA PLATFORM - DOCKER COMPOSE
# ============================================================================

services:

  # ==========================================================================
  # MINIO OBJECT STORAGE
  # ==========================================================================
  minio:
    image: minio/minio:RELEASE.2023-10-25T06-33-25Z
    container_name: minio
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_REGION_NAME: ${MINIO_REGION:-eu-west-2}

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO Console

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - data-platform-network

  # ==========================================================================
  # MINIO INITIALIZATION (BUCKET BOOTSTRAP)
  # ==========================================================================
  # Idempotent one-shot service that creates the medallion lakehouse buckets
  # (raw, staging, bronze, silver, gold, data-products, archive,
  # ai-intelligence) once MinIO is healthy. Re-runs safely on every `up`.
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}

    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        mc alias set local "http://$${MINIO_ENDPOINT}" "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        for BUCKET in epap-raw epap-staging epap-bronze epap-silver epap-gold epap-data-products epap-archive epap-ai-intelligence; do
          mc mb --ignore-existing "local/$${BUCKET}" || true
          echo "Bucket ensured: $${BUCKET}"
        done
        echo "MinIO bucket bootstrap complete."
        mc ls local

    networks:
      - data-platform-network

  # ==========================================================================
  # POSTGRESQL DATABASE
  # ==========================================================================
  postgres:
    image: postgres:16
    container_name: postgres16
    restart: unless-stopped

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: analytics

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - data-platform-network

  # ==========================================================================
  # TRINO COORDINATOR (SIMPLIFIED)
  # ==========================================================================
  trino-coordinator:
    build:
      context: ../trino
      dockerfile: Dockerfile.trino-coordinator
    container_name: trino-coordinator
    restart: unless-stopped
    env_file: .env
    # depends_on:
    #  - hive-metastore
    ports:
      - "8080:8080"
    volumes:
      - ../trino/etc/rules.json:/usr/lib/trino/etc/rules.json
      - trino-data:/data/trino
    # The complex healthcheck has been removed. It is not needed because the
    # dbt container will now perform its own, more accurate, wait check.
    networks:
      - data-platform-network

  # ==========================================================================
  # DBT DEVELOPMENT CONTAINER
  # ==========================================================================
  dbt:
    image: python:3.11-slim
    container_name: dbt
    working_dir: /usr/app/dbt

    volumes:
      - ../../dbt:/usr/app/dbt

    entrypoint: ["tail", "-f", "/dev/null"]

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - data-platform-network

# ============================================================================
# PERSISTENT STORAGE
# ============================================================================
volumes:
  postgres_data:
  minio_data:
  trino-data:

# ============================================================================
# NETWORKING
# ============================================================================
networks:
  data-platform-network:
    driver: bridge
